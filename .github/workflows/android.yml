name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EMRUL_KEYSTORE_BASE64: ${{ secrets.EMRUL_KEYSTORE_BASE64 }}
      EMRUL_KEYSTORE_PASSWORD: ${{ secrets.EMRUL_KEYSTORE_PASSWORD }}
      EMRUL_KEY_ALIAS: emrul-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private release signing key
        if: env.EMRUL_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          umask 077
          printf '%s' "$EMRUL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/emrul-release.p12"
          echo "EMRUL_KEYSTORE_PATH=$RUNNER_TEMP/emrul-release.p12" >> "$GITHUB_ENV"
      - run: gradle -p android --no-daemon :app:assembleRelease
      - run: python3 tests/verify-android.py
      - name: Verify signed release
        if: env.EMRUL_KEYSTORE_BASE64 != ''
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: env.EMRUL_KEYSTORE_BASE64 != ''
        with:
          name: Emrul-Invoice-Signed-Release
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.EMRUL_KEYSTORE_BASE64 == ''
        with:
          name: UNSIGNED-build-check-NOT-INSTALLABLE
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Signing setup reminder
        if: env.EMRUL_KEYSTORE_BASE64 == ''
        run: echo '::warning::Build compiled but is unsigned. Configure the persistent release key in repository Actions secrets before distributing new builds. Do not substitute a random debug key.'
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/emrul-release.p12"
